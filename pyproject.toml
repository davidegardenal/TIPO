[project]
name = "tipo"
version = "1.0.0"
requires-python = "==3.12.*"
dependencies = [
    "torch==2.7.0",
    "torchvision==0.22.0",
    "numpy==2.1.2",
    "opencv-python-headless==4.13.0.92",
    "pillow==12.1.1",
    "tqdm==4.67.1",
    "omegaconf==2.3.0",
    "hydra-core==1.3.2",
    "pycocotools==2.0.8",
    "scipy==1.17.1",
    "scikit-image==0.25.2",
    "matplotlib==3.10.1",
    "pandas==3.0.1",
    "more-itertools==10.8.0",
    "openai==1.76.2",
    "cupy-cuda12x==14.0.1",
    "cucim==23.10.0",
    # sam3 runtime deps
    "timm==1.0.25",
    "ftfy==6.1.1",
    "regex",
    "iopath==0.1.10",
    "huggingface-hub==1.7.2",
    "einops==0.8.2",
    "eva-decord==0.6.1",
    "psutil",
    "setuptools>=69,<81", # sam3 imports pkg_resources
    "socksio==1.0.0",
    "sam-2",
    "sam3",
]

[tool.uv]
package = false
override-dependencies = ["numpy==2.1.2"] # sam3 declares numpy<2 but works with >=2
no-build-isolation-package = ["sam-2"]   # compile sam2._C against the venv's torch
constraint-dependencies = [
    "annotated-doc==0.0.4",
    "annotated-types==0.7.0",
    "anyio==4.12.1",
    "certifi==2026.2.25",
    "click==8.3.1",
    "contourpy==1.3.3",
    "cuda-pathfinder==1.5.2",
    "filelock==3.25.2",
    "fonttools==4.62.1",
    "fsspec==2026.2.0",
    "hf-xet==1.4.2",
    "idna==3.11",
    "imageio==2.37.0",
    "jiter==0.13.0",
    "kiwisolver==1.5.0",
    "lazy-loader==0.5",
    "markdown-it-py==4.0.0",
    "markupsafe==3.0.3",
    "networkx==3.6.1",
    "packaging==26.0",
    "portalocker==3.2.0",
    "pyarrow==23.0.1",
    "pydantic==2.12.5",
    "pydantic-core==2.41.5",
    "pygments==2.19.2",
    "pyparsing==3.3.2",
    "rich==14.3.3",
    "safetensors==0.7.0",
    "tifffile==2026.3.3",
    "typer==0.24.1",
    "typing-extensions==4.15.0",
    "typing-inspection==0.4.2",
    "wcwidth==0.6.0",
    "regex==2026.2.28",
]

[tool.uv.extra-build-variables]
sam-2 = { SAM2_BUILD_CUDA = "1", SAM2_BUILD_ALLOW_ERRORS = "0", TORCH_CUDA_ARCH_LIST = "8.0" }

# Static metadata so `uv lock` doesn't need to build sam2 (non-isolated build needs torch in the venv)
[[tool.uv.dependency-metadata]]
name = "sam-2"
version = "1.0"
requires-dist = ["torch>=2.5.1", "torchvision>=0.20.1", "numpy>=1.24.4", "tqdm>=4.66.1", "hydra-core>=1.3.2", "iopath>=0.1.10", "pillow>=9.4.0"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
sam-2 = { path = "./deps/sam2", editable = true }
sam3 = { path = "./deps/sam3", editable = true }

[tool.pyrefly]
search-path = [".", "./deps/sam2", "./deps/sam3"]

[dependency-groups]
dev = [
    "scipy-stubs==1.17.1.5",
    "types-pycocotools==2.0.0.20261122",
    "types-tqdm==4.67.3.20260402",
]
