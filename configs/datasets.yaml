    name: vista
    data_dir: ${data_root}/VISTA/
    image_dir: ${data_root}/VISTA/JPEGImages
    anno_dir: ${data_root}/VISTA/Annotations
    split_dir: ${data_root}/VISTA/ImageSets
    trans_dir: ${data_root}/VISTA/Transformations
